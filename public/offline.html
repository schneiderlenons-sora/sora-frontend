<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sora — sem conexão</title>
<!--
  ⚠️ PÁGINA AUTOSSUFICIENTE, DE PROPÓSITO.
  Ela é servida pelo service worker quando a rede falhou. Qualquer CSS, fonte ou
  imagem externa aqui também falharia — então tudo é inline, e o ícone é SVG
  desenhado à mão. Nada nesta página faz uma requisição.
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 28px;
    background: #F5F6F8; color: #14181B;
    font: 400 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0A0A0B; color: #EAF0EC; }
    .sub { color: #8B958F !important; }
    .dica { background: #171F1C !important; border-color: #2A3733 !important; color: #B4C1BA !important; }
  }
  .caixa { max-width: 340px; text-align: center; display: grid; gap: 14px; justify-items: center; }
  h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .sub { font-size: 15px; margin: 0; color: #6B7671; }
  .dica {
    font-size: 13px; line-height: 1.5; margin: 6px 0 0; padding: 12px 14px;
    background: #FFFFFF; border: 1px solid #DCE3DB; border-radius: 12px; color: #3D474B;
  }
  button {
    margin-top: 4px; min-height: 48px; padding: 0 26px; border: 0; border-radius: 14px;
    background: #61D17B; color: #0A2A14; font-size: 15px; font-weight: 700; font-family: inherit;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid #2F8F4E; outline-offset: 2px; }
</style>
</head>
<body>
  <div class="caixa">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#61D17B"
         stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M2 8.8a16 16 0 0 1 6.5-3.3"/>
      <path d="M22 8.8a16 16 0 0 0-6.5-3.3"/>
      <path d="M5.5 12.6a11 11 0 0 1 3.2-1.9"/>
      <path d="M18.5 12.6a11 11 0 0 0-3.2-1.9"/>
      <path d="M9 16.4a6 6 0 0 1 6 0"/>
      <circle cx="12" cy="20" r="1" fill="#61D17B" stroke="none"/>
      <path d="M3 3l18 18" stroke-width="1.6" opacity=".45"/>
    </svg>

    <h1>Você está sem conexão</h1>
    <p class="sub">A Sora precisa de internet para carregar seus lançamentos.</p>

    <!-- A Sora funciona por WhatsApp: isto não é consolo, é o caminho que
         realmente resolve enquanto a rede do painel não volta. -->
    <p class="dica">
      Dá para continuar registrando pelo WhatsApp — é só mandar a mensagem para a
      Sora. Quando a conexão voltar, tudo aparece aqui.
    </p>

    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </div>

  <script>
    // Volta sozinho assim que a rede retornar — sem obrigar o toque no botão.
    addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
